<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #16211b; } .m { fill: #6b7570; } .g { fill: #1f5e3f; } .w { fill: #fff; }
    .h { font-size: 15px; font-weight: 700; fill: #16211b; }
    .n { font-size: 13px; font-weight: 700; fill: #fff; }
    .s { font-size: 12px; } .xs { font-size: 11px; } .b { font-weight: 600; }
    .card { fill: #fff; stroke: #e4e8e3; stroke-width: 1.5; }
    /* one 14 s loop; each element fades in at its own moment and everything resets at the end */
    .a21, .a25, .a33, .a42, .a50, .a57, .a61, .a67, .a72, .a78 { opacity: 0; animation-duration: 14s; animation-iteration-count: infinite; }
    .a21 { animation-name: a21; } .a25 { animation-name: a25; } .a33 { animation-name: a33; }
    .a42 { animation-name: a42; } .a50 { animation-name: a50; } .a57 { animation-name: a57; }
    .a61 { animation-name: a61; } .a67 { animation-name: a67; } .a72 { animation-name: a72; } .a78 { animation-name: a78; }
    @keyframes a21 { 0%, 16% { opacity: 0 } 18%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a25 { 0%, 19% { opacity: 0 } 22%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a33 { 0%, 26% { opacity: 0 } 28%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a42 { 0%, 33% { opacity: 0 } 35%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a50 { 0%, 39% { opacity: 0 } 42%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a57 { 0%, 45% { opacity: 0 } 47%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a61 { 0%, 48% { opacity: 0 } 50%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a67 { 0%, 53% { opacity: 0 } 55%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a72 { 0%, 57% { opacity: 0 } 59%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a78 { 0%, 62% { opacity: 0 } 64%, 97% { opacity: 1 } 100% { opacity: 0 } }
    .installing { animation: installing 14s infinite; opacity: 0; }
    @keyframes installing { 0%, 39% { opacity: 0 } 42%, 47% { opacity: 1 } 50%, 100% { opacity: 0 } }
    .press { transform-box: fill-box; transform-origin: center; animation: press 14s infinite; }
    @keyframes press { 0%, 10% { transform: scale(1) } 13% { transform: scale(1.06) } 14% { transform: scale(0.96) } 16%, 100% { transform: scale(1) } }
    .bar { transform-box: fill-box; transform-origin: left; animation: bar 14s infinite; transform: scaleX(0); }
    @keyframes bar { 0%, 19% { transform: scaleX(0) } 44%, 97% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
  </style>

  <rect width="960" height="420" rx="18" fill="#f7f8f5"/>

  <!-- step headings -->
  <circle cx="34" cy="38" r="13" class="g"/><text x="34" y="43" text-anchor="middle" class="n">1</text>
  <text x="56" y="43" class="h">See an app you like</text>
  <circle cx="354" cy="38" r="13" class="g"/><text x="354" y="43" text-anchor="middle" class="n">2</text>
  <text x="376" y="43" class="h">Your agent builds your own</text>
  <circle cx="714" cy="38" r="13" class="g"/><text x="714" y="43" text-anchor="middle" class="n">3</text>
  <text x="736" y="43" class="h">It is on your phone</text>

  <!-- 1: Play Store listing, as shown in sayn's "Get inspired" tab -->
  <rect x="20" y="66" width="284" height="320" rx="16" class="card"/>
  <rect x="40" y="86" width="52" height="52" rx="12" fill="#f29a38"/>
  <path d="M54 113 l8 8 l16 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="106" class="t s b" font-size="14">Habit Tracker Pro</text>
  <text x="104" y="124" class="m xs">Top free · Productivity</text>
  <text x="40" y="166" class="t s b">4.4 ★</text><text x="92" y="166" class="t s b">10M+</text>
  <text x="40" y="181" class="m xs">rating</text><text x="92" y="181" class="m xs">installs</text>
  <rect x="40" y="196" width="72" height="104" rx="8" fill="#eef3ec"/>
  <rect x="120" y="196" width="72" height="104" rx="8" fill="#eef3ec"/>
  <rect x="200" y="196" width="72" height="104" rx="8" fill="#eef3ec"/>
  <rect x="50" y="210" width="52" height="8" rx="4" fill="#d5ddd4"/><rect x="50" y="226" width="40" height="8" rx="4" fill="#d5ddd4"/>
  <rect x="130" y="210" width="52" height="40" rx="6" fill="#d5ddd4"/><rect x="210" y="210" width="52" height="8" rx="4" fill="#d5ddd4"/>
  <rect x="40" y="310" width="232" height="24" rx="12" fill="#fde3e1"/>
  <text x="156" y="326" text-anchor="middle" font-size="11.5" fill="#8a2a22" class="b">Ads · Premium $6.99 / month</text>
  <g class="press">
    <rect x="40" y="342" width="232" height="34" rx="17" class="g"/>
    <text x="156" y="364" text-anchor="middle" class="w s b" font-size="13">Make my own</text>
  </g>

  <!-- arrow 1 -->
  <path d="M310 226 h22 m-7 -7 l7 7 l-7 7" stroke="#c9d2c8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="a21" d="M310 226 h22 m-7 -7 l7 7 l-7 7" stroke="#1f5e3f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2: sayn dashboard on the laptop -->
  <rect x="340" y="66" width="324" height="320" rx="16" class="card"/>
  <text x="360" y="94" class="t s b" font-size="13">sayn · new app</text>
  <rect x="566" y="80" width="80" height="22" rx="11" fill="#e3efe6"/>
  <text x="606" y="95" text-anchor="middle" font-size="11" fill="#0f3b27" class="b">Claude Code</text>
  <rect x="360" y="110" width="286" height="50" rx="10" fill="#f7f8f5" stroke="#e4e8e3"/>
  <text x="372" y="131" class="t s">Like this one, but no ads and</text>
  <text x="372" y="148" class="t s">a weekly streak view.</text>

  <g class="a25"><circle cx="372" cy="186" r="8" class="g"/><path d="M368 186 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="388" y="190" class="t s">Read the listing and screenshots</text></g>
  <g class="a33"><circle cx="372" cy="216" r="8" class="g"/><path d="M368 216 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="388" y="220" class="t s">Wrote the app (React Native)</text></g>
  <g class="a42"><circle cx="372" cy="246" r="8" class="g"/><path d="M368 246 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="388" y="250" class="t s">Built a signed APK</text></g>
  <g class="a50"><circle cx="372" cy="276" r="8" class="g"/><path d="M368 276 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="388" y="280" class="t s">Installed on Pixel over USB</text></g>

  <rect x="360" y="306" width="286" height="8" rx="4" fill="#eef3ec"/>
  <rect x="360" y="306" width="286" height="8" rx="4" class="g bar"/>
  <text x="360" y="344" class="m xs">About 5 minutes, on your laptop.</text>
  <text x="360" y="362" class="m xs">Uses the Claude or ChatGPT plan you already pay for.</text>

  <!-- arrow 2 -->
  <path d="M672 226 h22 m-7 -7 l7 7 l-7 7" stroke="#c9d2c8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="a57" d="M672 226 h22 m-7 -7 l7 7 l-7 7" stroke="#1f5e3f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3: the phone -->
  <rect x="716" y="62" width="200" height="330" rx="30" fill="#16211b"/>
  <rect x="726" y="72" width="180" height="310" rx="22" fill="#eef3ec"/>
  <circle cx="816" cy="86" r="4" fill="#16211b"/>
  <g class="installing">
    <circle cx="816" cy="216" r="16" fill="none" stroke="#c9d2c8" stroke-width="4"/>
    <path d="M816 200 a16 16 0 0 1 16 16" fill="none" stroke="#1f5e3f" stroke-width="4" stroke-linecap="round"/>
    <text x="816" y="256" text-anchor="middle" class="m s">Installing…</text>
  </g>
  <g class="a61">
    <rect x="726" y="72" width="180" height="310" rx="22" fill="#fff"/>
    <text x="742" y="120" class="t b" font-size="17">Habits</text>
    <text x="742" y="138" class="m xs">Today</text>
    <rect x="742" y="150" width="148" height="34" rx="10" fill="#e3efe6"/>
    <text x="754" y="172" class="t s">Drink water</text>
    <rect x="742" y="192" width="148" height="34" rx="10" fill="#e3efe6"/>
    <text x="754" y="214" class="t s">Read 20 min</text>
    <rect x="742" y="234" width="148" height="34" rx="10" fill="#f7f8f5"/>
    <text x="754" y="256" class="t s">Walk 8k steps</text>
    <circle cx="874" cy="251" r="8" fill="none" stroke="#c9d2c8" stroke-width="2"/>
    <text x="742" y="294" class="m xs">This week</text>
    <rect x="742" y="302" width="18" height="18" rx="5" class="g"/><rect x="764" y="302" width="18" height="18" rx="5" class="g"/>
    <rect x="786" y="302" width="18" height="18" rx="5" class="g"/><rect x="808" y="302" width="18" height="18" rx="5" class="g"/>
    <rect x="830" y="302" width="18" height="18" rx="5" class="g"/><rect x="852" y="302" width="18" height="18" rx="5" fill="#eef3ec"/>
    <rect x="874" y="302" width="18" height="18" rx="5" fill="#eef3ec"/>
  </g>
  <g class="a67"><circle cx="874" cy="167" r="8" class="g"/><path d="M870 167 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/></g>
  <g class="a72"><circle cx="874" cy="209" r="8" class="g"/><path d="M870 209 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/></g>
  <g class="a78">
    <rect x="740" y="336" width="152" height="24" rx="12" fill="#dcefe2"/>
    <text x="816" y="352" text-anchor="middle" font-size="11" fill="#1f5e3f" class="b">No ads · No paywall · Yours</text>
  </g>

  <text x="480" y="408" text-anchor="middle" class="m xs">Or skip step 1 and just describe the app you want in a sentence. Change it later the same way.</text>
</svg>
